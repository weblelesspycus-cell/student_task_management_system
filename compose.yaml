services:
  task-manager:
    build: .
    container_name: student_task_manager
    ports:
      - "5009:5000"
    environment:
      SECRET_KEY: "replace-this-with-a-long-random-secret"
      DATABASE_PATH: /data/tasks.db
    volumes:
      - task_data:/data
    restart: unless-stopped

volumes:
  task_data:
