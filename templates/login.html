{% extends "base.html" %}{% block title %}Log in{% endblock %}{% block content %}
<div class="auth-card"><h2 class="fw-bold">Welcome back</h2><p class="text-muted">Log in to view your tasks.</p>
<form method="post"><label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required>
<button class="btn btn-primary w-100">Log in</button></form><p class="mt-3 mb-0 text-center">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div>{% endblock %}
